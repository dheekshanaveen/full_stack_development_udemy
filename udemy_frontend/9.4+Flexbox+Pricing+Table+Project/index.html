<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Oswald", sans-serif;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          display: flex;
          flex-direction: row;
          gap: 2rem;
          align-items: center;
        }
      }
      .pricing-plan {
        background-color: #f2f2f2;
        height: 200px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;

        .plan-features {
          display: flex;
          flex-direction: column;
          flex-wrap: wrap;
          gap: 10px;
          align-items: center;
        }
      }
      .plan-button {
        background-color: rgb(207, 169, 155);
        border-radius: 2.5px;
        border: 20px;
        color: white;
        padding-bottom: 5px;
      }
      .plan-title {
        font-weight: bold;
        font-size: 10px;
      }
      .plan-price {
        font-weight: bold;
        font-size: 30px;
      }
      @media (max-width: 600px) {
        .pricing-container {
          display: flex;
          flex-direction: column;
        }
      }
      .plan-features {
        list-style: none;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
          <button class="plan-button">Sign Up</button>
        </ul>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; <br />Email Support</li>
          <button class="plan-button">Sign Up</button>
        </ul>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
          <button class="plan-button">Sign Up</button>
        </ul>
      </div>
    </div>
  </body>
</html>
